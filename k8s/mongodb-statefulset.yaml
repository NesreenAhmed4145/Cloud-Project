# 1. الـ Persistent Volume: ده "الهارد ديسك" الحقيقي على السيرفر
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/mongo" # المسار اللي هيتخزن فيه على اللينكس
---
# 2. الـ Persistent Volume Claim: ده الـ "حجز" اللي المونجو بيطلبه
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# 3. الـ Service: زي ما هي
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  ports:
  - port: 27017
    targetPort: 27017
  selector:
    app: mongodb
---
# 4. الـ StatefulSet: التعديل هنا في الـ volumeMounts والـ volumes
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: "mongodb"
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db # المسار الداخلي جوه المونجو
      volumes:
      - name: mongo-storage
        persistentVolumeClaim:
          claimName: mongo-pvc