apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  ports:
  - port: 5002
    targetPort: 5002
  selector:
    app: order-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: food-delivery-order:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5002
        env:
        - name: MONGO_URI
          value: "mongodb://mongodb:27017/food_delivery_orders"
        - name: PORT
          value: "5002"